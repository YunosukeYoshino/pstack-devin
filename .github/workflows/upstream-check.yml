name: upstream-check

on:
  schedule:
    - cron: "17 0 * * 1" # Mon 09:17 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare versions and open an upstream-sync issue
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: backnotprop/pstack
          LABEL: upstream-sync
        run: ./scripts/check-upstream.sh
